function App() {
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem('theme') === 'dark'; } catch(e) { return false; }
  });
  const [active, setActive] = useState('All PDFs');
  const [query, setQuery] = useState('');

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch(e) {}
  }, [dark]);

  const counts = useMemo(() => {
    const c = {};
    BOOKS.forEach(b => { c[b.cat] = (c[b.cat] || 0) + 1; });
    return c;
  }, []);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return BOOKS.filter(b => {
      const inCat = active === 'All PDFs' || b.cat === active;
      const inQuery = !q || b.title.toLowerCase().includes(q) || b.sub.toLowerCase().includes(q) || b.cat.toLowerCase().includes(q);
      return inCat && inQuery;
    });
  }, [active, query]);

  return (
    <React.Fragment>
      <Header query={query} setQuery={setQuery} dark={dark} setDark={setDark} />
      <main>
        <Hero />
        <Categories active={active} setActive={setActive} counts={counts} />
        <Banner />
        <Latest books={filtered} />
        <Popular />
        <QuickLinks />
        <CTA />
        <PdfShowcase />
        <FAQ />
      </main>
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
