<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#202a29" />
  <title>Open a PDF | ThunderStudy</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
  <link rel="manifest" href="/site.webmanifest?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="pdf-start-page">
  <main class="pdf-start-shell">
    <a class="brand start-brand" href="/"><span class="brand-mark"><img src="/favicon.svg?v=2" alt="ThunderStudy PDF" /></span><span>ThunderStudy <em>PDF</em></span></a>
    <section class="pdf-start-card">
      <div class="eyebrow"><span></span> Open your next chapter</div>
      <h1>Bring a PDF<br /><i>to life.</i></h1>
      <p>Upload a file from your device or paste a direct PDF link. We’ll turn it into a full-size two-page flipbook.</p>
      <div class="pdf-input-row">
        <label class="upload-drop" for="pdf-file"><i data-lucide="upload"></i><span><strong>Upload a PDF</strong><small>Choose from your device</small></span><input id="pdf-file" type="file" accept="application/pdf" /></label>
        <span class="or-divider">or</span>
        <form id="link-form" class="url-form"><label for="pdf-link">Paste a PDF link</label><div><i data-lucide="link-2"></i><input id="pdf-link" type="url" placeholder="https://example.com/book.pdf" autocomplete="url" /><button type="submit" aria-label="Open PDF"><i data-lucide="arrow-right"></i></button></div></form>
      </div>
      <p class="pdf-start-hint" id="start-hint">Your document stays in this browser tab while you read.</p>
    </section>
    <a class="back-link" href="/"><i data-lucide="arrow-left"></i> Back to library</a>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    const file=document.querySelector('#pdf-file'),form=document.querySelector('#link-form'),link=document.querySelector('#pdf-link'),hint=document.querySelector('#start-hint');
    const dbRequest=indexedDB.open('thunderstudy-reader',1);dbRequest.onupgradeneeded=()=>dbRequest.result.createObjectStore('documents');
    function putFile(blob,title){return new Promise((resolve,reject)=>{const request=indexedDB.open('thunderstudy-reader',1);request.onsuccess=()=>{const tx=request.result.transaction('documents','readwrite');tx.objectStore('documents').put({blob,title},'active');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)}})}
    function openReader(url,title){const query=new URLSearchParams();if(url)query.set('link',url);if(title)query.set('title',title);else if(sessionStorage.getItem('ts-pdf-title'))query.set('title',sessionStorage.getItem('ts-pdf-title'));location.assign(`/reader${query.toString()?`?${query}`:''}`)}
    file.addEventListener('change',async event=>{const picked=event.target.files[0];if(!picked)return;if(picked.type!=='application/pdf'){hint.textContent='Please choose a PDF file.';return}hint.textContent='Preparing your PDF…';try{const name=picked.name.replace(/\.pdf$/i,'');await putFile(picked,name);sessionStorage.setItem('ts-pdf-source','indexeddb');sessionStorage.setItem('ts-pdf-title',name);location.assign(`/reader?source=upload&title=${encodeURIComponent(name)}`)}catch{hint.textContent='The file could not be prepared. Please try again.'}});
    form.addEventListener('submit',event=>{event.preventDefault();try{const url=new URL(link.value.trim());if(!/^https?:$/.test(url.protocol))throw new Error();sessionStorage.setItem('ts-pdf-source',url.href);sessionStorage.setItem('ts-pdf-title','Linked PDF');openReader(url.href,'Linked PDF')}catch{hint.textContent='Enter a valid PDF URL, including https://';link.focus()}});window.lucide?.createIcons();const params=new URLSearchParams(location.search);if(params.get('link'))openReader(params.get('link'),params.get('title')||'Linked PDF');
  </script>
</body>
</html>
